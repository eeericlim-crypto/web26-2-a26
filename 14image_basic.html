    <h2>15audio_basic</h2>

    <h2>16audio_source</h2>
    <!--웹 브라우저마다 지원하는 파일 확장자가 다른 문제는 audio, video 태그 내부에 source태크를 입력해 해결->
    <audio controls="controls">
        <source src="Kalimba.mp3" type="audio/mp3">
        <source src="Kalimba.ogg" type="audio/ogg">
    </audio>

    <h2>17video_basic</h2>
    <!--동영상-->
    <video controls="controls">
        <source src="Wildlife.mp4" type="video/mp4">
        <source src="Wildlife.webm" type="video/webm">
    </video>

    <h2>18video_poster</h2>
    <video controls="controls" poster=""이히히힣images.jpg">
        <source src="Wildlife.mp4" type"video/mp4">
        <source src="Wildlife.webm" type"video/webm">
    </video>


</body>
